server {
  listen 8080;
  root /usr/share/nginx/html;

  # Client-side routes like /keys or /invite/<token> all load the app
  location / {
    try_files $uri /index.html;
  }

  # After a 401, MCP clients look here for OAuth metadata. A 404 is the honest answer, not the app's HTML.
  location /.well-known/ {
    return 404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
