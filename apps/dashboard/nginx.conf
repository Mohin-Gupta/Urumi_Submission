server {
  listen 8080;
  root /usr/share/nginx/html;

  # nginx drops these if a location adds its own headers, so locations below use "expires" instead
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  # Client-side routes like /keys or /invite/<token> all load the app
  location / {
    try_files $uri /index.html;
  }

  # After a 401, MCP clients look here for OAuth metadata. A 404 is the honest answer, not the app's HTML.
  location /.well-known/ {
    return 404;
  }

  # File names contain a content hash, so they can be cached for good
  location /assets/ {
    expires 1y;
  }
}
