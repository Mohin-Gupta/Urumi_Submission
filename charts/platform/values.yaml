# Public hosts are store.<domain> and app.<domain>
domain: 127.0.0.1.nip.io

ingress:
  className: traefik
  tls: false
  annotations: {}
  # Where the ingress controller runs, so NetworkPolicies can let it in
  controller:
    namespace: kube-system
    podLabels:
      app.kubernetes.io/name: traefik

# Where cluster DNS runs, so egress NetworkPolicies can allow name lookups
dns:
  namespace: kube-system
  podLabels:
    k8s-app: kube-dns

# Empty means the cluster's default StorageClass
storageClass: ""

# Prefix for our own images, with a trailing slash (e.g. ghcr.io/you/). Empty = images imported into the cluster.
imageRegistry: ""

# When set, the chart creates a Let's Encrypt ClusterIssuer named "letsencrypt" (needs cert-manager installed)
certManager:
  issuerEmail: ""

images:
  mcpServers: urumi/mcp-servers:0.1.4
  everything: urumi/everything-mcp:2.0.1
  gateway: urumi/gateway:0.6.0
  dashboard: urumi/dashboard:0.4.5

dashboard:
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

gateway:
  adminEmail: admin@example.com
  callTimeoutMs: 30000
  # Tool calls per user per minute, across all their keys and the chat
  rateLimitPerMinute: 60
  # Registered on first boot only; after that admins manage servers in the dashboard
  seedServers:
    - slug: woo
      name: WooCommerce
      url: "http://woo-mcp/mcp"
      # Members can read the store; only admins can change it
      adminOnlyTools: [create_product, update_order_status]
    - { slug: notes, name: Team Notes, url: "http://notes-mcp/mcp" }
    - { slug: everything, name: MCP Everything, url: "http://everything-mcp/mcp" }
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

# Any OpenAI-compatible chat API. The key is never in values; create it with:
#   kubectl -n urumi create secret generic llm-secrets --from-literal=api-key=<key>
llm:
  baseUrl: https://generativelanguage.googleapis.com/v1beta/openai
  model: gemini-2.5-flash

postgres:
  image: postgres:17-alpine
  storage: 1Gi
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

mcpServerResources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 500m, memory: 256Mi }

mariadb:
  image: mariadb:11.4
  storage: 2Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }

store:
  # Core files live on the volume, so the setup Job updates them to this version
  wordpressVersion: "7.0"
  woocommerceVersion: "11.2.1"
  storefrontVersion: "4.6.2"
  cliImage: wordpress:cli-2.12-php8.3
  storage: 2Gi
  title: Urumi Store
  adminUser: admin
  adminEmail: admin@example.com
  timezone: Asia/Kolkata
  currency: INR
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }
  setupResources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 768Mi }
