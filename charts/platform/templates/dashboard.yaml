apiVersion: v1
kind: Service
metadata:
  name: dashboard
  labels: {{- include "platform.labels" "dashboard" | nindent 4 }}
spec:
  selector: {{- include "platform.selector" "dashboard" | nindent 4 }}
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  labels: {{- include "platform.labels" "dashboard" | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "platform.selector" "dashboard" | nindent 6 }}
  template:
    metadata:
      labels: {{- include "platform.labels" "dashboard" | nindent 8 }}
    spec:
      containers:
        - name: dashboard
          image: {{ .Values.imageRegistry }}{{ .Values.images.dashboard }}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 20
          resources: {{- toYaml .Values.dashboard.resources | nindent 12 }}
          securityContext: {{- include "platform.securityContext" 101 | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
