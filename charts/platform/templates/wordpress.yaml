apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wordpress-data
  labels: {{- include "platform.labels" "wordpress" | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- include "platform.storageClass" . | indent 2 }}
  resources:
    requests:
      storage: {{ .Values.store.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress
  labels: {{- include "platform.labels" "wordpress" | nindent 4 }}
spec:
  selector: {{- include "platform.selector" "wordpress" | nindent 4 }}
  ports:
    - port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  labels: {{- include "platform.labels" "wordpress" | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "platform.selector" "wordpress" | nindent 6 }}
  template:
    metadata:
      labels: {{- include "platform.labels" "wordpress" | nindent 8 }}
    spec:
      containers:
        - name: wordpress
          image: wordpress:{{ .Values.store.wordpressVersion }}-php8.3-apache
          ports:
            - containerPort: 80
          env: {{- include "store.dbEnv" . | nindent 12 }}
          # liveness skips PHP and the DB, so a DB outage doesn't restart WordPress
          readinessProbe:
            httpGet: { path: /wp-login.php, port: 80 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /wp-includes/images/blank.gif, port: 80 }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources: {{- toYaml .Values.store.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/www/html
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: wordpress-data
---
{{ include "platform.ingress" (dict "root" . "name" "store" "sub" "store" "paths" (list (dict "path" "/" "service" "wordpress" "port" 80))) }}
