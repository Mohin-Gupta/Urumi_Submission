{{- $s := dict "root" . "name" "store-secrets" -}}
apiVersion: v1
kind: Secret
metadata:
  name: store-secrets
  labels: {{- include "platform.labels" "store" | nindent 4 }}
  annotations:
    # The database volume outlives an uninstall, so its password must too
    helm.sh/resource-policy: keep
type: Opaque
data:
  mariadb-root-password: {{ include "platform.secretValue" (merge (dict "key" "mariadb-root-password" "value" (randAlphaNum 24)) $s) }}
  db-password: {{ include "platform.secretValue" (merge (dict "key" "db-password" "value" (randAlphaNum 24)) $s) }}
  admin-password: {{ include "platform.secretValue" (merge (dict "key" "admin-password" "value" (randAlphaNum 16)) $s) }}
  wc-consumer-key: {{ include "platform.secretValue" (merge (dict "key" "wc-consumer-key" "value" (printf "ck_%s" (randAlphaNum 40 | lower))) $s) }}
  wc-consumer-secret: {{ include "platform.secretValue" (merge (dict "key" "wc-consumer-secret" "value" (printf "cs_%s" (randAlphaNum 40 | lower))) $s) }}
