# ClusterIP only, no Ingress: this server is never exposed outside the cluster
apiVersion: v1
kind: Service
metadata:
  name: woo-mcp
  labels: {{- include "platform.labels" "woo-mcp" | nindent 4 }}
spec:
  selector: {{- include "platform.selector" "woo-mcp" | nindent 4 }}
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: woo-mcp
  labels: {{- include "platform.labels" "woo-mcp" | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "platform.selector" "woo-mcp" | nindent 6 }}
  template:
    metadata:
      labels: {{- include "platform.labels" "woo-mcp" | nindent 8 }}
    spec:
      containers:
        - name: woo-mcp
          image: {{ .Values.images.mcpServers }}
          command: [node, dist/woo.js]
          ports:
            - containerPort: 8080
          env:
            - name: WOO_URL
              value: http://wordpress
            - name: STORE_URL
              value: {{ include "platform.url" (dict "root" . "sub" "store") }}
            - name: STORE_TIMEZONE
              value: {{ .Values.store.timezone }}
            - name: WOO_KEY
              valueFrom:
                secretKeyRef: { name: store-secrets, key: wc-consumer-key }
            - name: WOO_SECRET
              valueFrom:
                secretKeyRef: { name: store-secrets, key: wc-consumer-secret }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 20
          resources: {{- toYaml .Values.mcpServerResources | nindent 12 }}
          securityContext: {{- include "platform.securityContext" . | nindent 12 }}
