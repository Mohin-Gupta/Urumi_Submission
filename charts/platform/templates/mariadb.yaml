apiVersion: v1
kind: Service
metadata:
  name: mariadb
  labels: {{- include "platform.labels" "mariadb" | nindent 4 }}
spec:
  clusterIP: None
  selector: {{- include "platform.selector" "mariadb" | nindent 4 }}
  ports:
    - port: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  labels: {{- include "platform.labels" "mariadb" | nindent 4 }}
spec:
  serviceName: mariadb
  replicas: 1
  selector:
    matchLabels: {{- include "platform.selector" "mariadb" | nindent 6 }}
  template:
    metadata:
      labels: {{- include "platform.labels" "mariadb" | nindent 8 }}
    spec:
      containers:
        - name: mariadb
          image: {{ .Values.mariadb.image }}
          ports:
            - containerPort: 3306
          env:
            - name: MARIADB_DATABASE
              value: wordpress
            - name: MARIADB_USER
              value: wordpress
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef: { name: store-secrets, key: db-password }
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: store-secrets, key: mariadb-root-password }
          readinessProbe:
            exec:
              command: [healthcheck.sh, --connect, --innodb_initialized]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [healthcheck.sh, --connect]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources: {{- toYaml .Values.mariadb.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- include "platform.storageClass" . | indent 8 }}
        resources:
          requests:
            storage: {{ .Values.mariadb.storage }}
