{{- define "netpol.from" -}}
- podSelector:
    matchLabels: {{- include "platform.selector" . | nindent 6 }}
{{- end }}
{{- define "netpol.fromIngressController" -}}
- namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: {{ .Values.ingress.controller.namespace }}
  podSelector:
    matchLabels: {{- toYaml .Values.ingress.controller.podLabels | nindent 6 }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mariadb
spec:
  podSelector:
    matchLabels: {{- include "platform.selector" "mariadb" | nindent 6 }}
  ingress:
    - from:
        {{- include "netpol.from" "wordpress" | nindent 8 }}
        {{- include "netpol.from" "store-setup" | nindent 8 }}
      ports:
        - port: 3306
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wordpress
spec:
  podSelector:
    matchLabels: {{- include "platform.selector" "wordpress" | nindent 6 }}
  ingress:
    - from:
        {{- include "netpol.fromIngressController" . | nindent 8 }}
        {{- include "netpol.from" "woo-mcp" | nindent 8 }}
      ports:
        - port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
spec:
  podSelector:
    matchLabels: {{- include "platform.selector" "postgres" | nindent 6 }}
  ingress:
    - from:
        {{- include "netpol.from" "gateway" | nindent 8 }}
      ports:
        - port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: public-apps
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [gateway, dashboard] }
  ingress:
    - from:
        {{- include "netpol.fromIngressController" . | nindent 8 }}
      ports:
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-upstreams
spec:
  podSelector:
    matchLabels:
      mcp-upstream: "true"
  ingress:
    - from:
        {{- include "netpol.from" "gateway" | nindent 8 }}
      ports:
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-upstreams-egress
spec:
  podSelector:
    matchLabels:
      mcp-upstream: "true"
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.dns.namespace }}
          podSelector:
            matchLabels: {{- toYaml .Values.dns.podLabels | nindent 14 }}
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: woo-mcp-egress
spec:
  podSelector:
    matchLabels: {{- include "platform.selector" "woo-mcp" | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        {{- include "netpol.from" "wordpress" | nindent 8 }}
      ports:
        - port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: databases-no-egress
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [mariadb, postgres] }
  policyTypes: [Egress]
