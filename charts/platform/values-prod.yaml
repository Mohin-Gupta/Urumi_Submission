# A k3s VPS. Everything not listed here is the same as local.

# <vps-ip>.nip.io works without buying a domain; a real domain needs A records for store. and app.
domain: CHANGE_ME.nip.io

# Images are pushed here by scripts/build-images.sh
imageRegistry: ghcr.io/CHANGE_ME/

ingress:
  tls: true
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt

certManager:
  issuerEmail: CHANGE_ME@example.com

# k3s ships local-path; swap for your provider's class (e.g. hcloud-volumes) to survive node loss
storageClass: local-path

mariadb:
  storage: 10Gi

store:
  storage: 10Gi
  adminEmail: CHANGE_ME@example.com

postgres:
  storage: 5Gi

gateway:
  adminEmail: CHANGE_ME@example.com
