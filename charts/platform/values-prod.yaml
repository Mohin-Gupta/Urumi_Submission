# k3s VPS. Anything not here is the same as local.

# <vps-ip>.nip.io works without buying a domain
domain: CHANGE_ME.nip.io

imageRegistry: ghcr.io/CHANGE_ME/

ingress:
  tls: true
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt

certManager:
  issuerEmail: CHANGE_ME@example.com

# use your provider's class to survive losing the node
storageClass: local-path

mariadb:
  storage: 10Gi

store:
  storage: 10Gi
  adminEmail: CHANGE_ME@example.com

postgres:
  storage: 5Gi

gateway:
  adminEmail: CHANGE_ME@example.com
